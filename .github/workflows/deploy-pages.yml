name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish outputs to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          rsync -a --delete --exclude='.git' --exclude='.nojekyll' outputs/ "$RUNNER_TEMP/pages/"
          cd "$RUNNER_TEMP/pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Pages content is already current.'
            exit 0
          fi
          git commit -m 'Publish dashboard from main'
          git push origin HEAD:gh-pages
